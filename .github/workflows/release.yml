name: Release Linux

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version
        required: true
        default: "3.12.13"
      openssl_version:
        description: OpenSSL version
        required: true
        default: "3.2.3"
      esp_idf_version:
        description: ESP-IDF version
        required: true
        default: "v5.4.1"

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  release-linux:
    runs-on: [self-hosted,dev-machine]

    env:
      IMAGE_NAME: pcwcc-release-build:ci
      PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.12.13' }}
      OPENSSL_VERSION: ${{ github.event.inputs.openssl_version || '3.2.3' }}
      ESP_IDF_VERSION: ${{ github.event.inputs.esp_idf_version || 'v5.4.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ubuntu20
          load: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            OPENSSL_VERSION=${{ env.OPENSSL_VERSION }}
            ESP_IDF_VERSION=${{ env.ESP_IDF_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Show tool versions
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "${IMAGE_NAME}" \
            bash -lc 'python --version && openssl version && idf.py --version'

      - name: Run tests
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "${IMAGE_NAME}" \
            bash -lc '
              python -m venv /tmp/pcwcc-test-venv
              . /tmp/pcwcc-test-venv/bin/activate
              python -m pip install --upgrade pip wheel setuptools
              python -m pip install -e ./pcwcc
              python -m pip install -r ./pcwcc/tests/requirements.txt
              pytest ./pcwcc/tests
            '

      - name: Build AppImage
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "${IMAGE_NAME}" \
            bash -lc './scripts/build_appimage.sh "${GITHUB_SHA::7}"'

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcwcc-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error