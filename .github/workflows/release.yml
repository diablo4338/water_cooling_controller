name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0-alpha"
        required: true
        default: "v0.1.0-alpha"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build release on Ubuntu 20.04 container
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04

    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHON_VERSION: 3.12.13
      OPENSSL_VERSION: 3.2.3
      OPENSSL_ROOT_DIR: /opt/openssl-3.2.3
      OPENSSL_DIR: /opt/openssl-3.2.3
      LD_LIBRARY_PATH: /opt/openssl-3.2.3/lib64:/opt/python-3.12.13/lib
      PATH: /opt/openssl-3.2.3/bin:/opt/python-3.12.13/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      IDF_VERSION: v5.4.1
      PYTHON_BIN: python3.12
      PYTHON: python3.12

    steps:
      - name: Install base packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            wget \
            git \
            zip \
            unzip \
            xz-utils \
            file \
            libfuse2 \
            bash \
            make \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            flex \
            bison \
            gperf \
            pkg-config \
            patchelf \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libncursesw5-dev \
            libgdbm-dev \
            liblzma-dev \
            libexpat1-dev \
            tk-dev \
            uuid-dev \
            zlib1g-dev \
            dfu-util \
            libusb-1.0-0 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxcb1 \
            libx11-6 \
            libxext6 \
            libxrender1 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            zlib1g \
            python3 \
            python3-pip \
            python3-venv
          rm -rf /var/lib/apt/lists/*

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build OpenSSL 3.2.3
        run: |
          cd /tmp
          wget -O "openssl-${OPENSSL_VERSION}.tar.gz" \
            "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar -xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure linux-x86_64 \
            --prefix="${OPENSSL_ROOT_DIR}" \
            --openssldir="${OPENSSL_ROOT_DIR}/ssl" \
            shared \
            zlib
          make -j"$(nproc)"
          make install_sw
          test -f "${OPENSSL_ROOT_DIR}/lib64/libssl.so.3"
          test -f "${OPENSSL_ROOT_DIR}/lib64/libcrypto.so.3"
          echo "${OPENSSL_ROOT_DIR}/lib64" > "/etc/ld.so.conf.d/openssl-${OPENSSL_VERSION}.conf"
          ldconfig
          ln -sf "${OPENSSL_ROOT_DIR}/bin/openssl" /usr/local/bin/openssl
          rm -rf "/tmp/openssl-${OPENSSL_VERSION}" "/tmp/openssl-${OPENSSL_VERSION}.tar.gz"

      - name: Build Python 3.12.13
        run: |
          cd /tmp
          wget -O "Python-${PYTHON_VERSION}.tgz" \
            "https://www.python.org/ftp/python/${PYTHON_VERSION}/Python-${PYTHON_VERSION}.tgz"
          tar -xzf "Python-${PYTHON_VERSION}.tgz"
          cd "Python-${PYTHON_VERSION}"
          PKG_CONFIG_PATH="${OPENSSL_ROOT_DIR}/lib64/pkgconfig" \
          CPPFLAGS="-I${OPENSSL_ROOT_DIR}/include" \
          LDFLAGS="-L${OPENSSL_ROOT_DIR}/lib64 -Wl,-rpath,${OPENSSL_ROOT_DIR}/lib64" \
          LD_LIBRARY_PATH="${OPENSSL_ROOT_DIR}/lib64" \
          ./configure \
            --prefix="/opt/python-${PYTHON_VERSION}" \
            --enable-shared \
            --with-ensurepip=install \
            --with-openssl="${OPENSSL_ROOT_DIR}" \
            --with-openssl-rpath=auto
          PKG_CONFIG_PATH="${OPENSSL_ROOT_DIR}/lib64/pkgconfig" \
          CPPFLAGS="-I${OPENSSL_ROOT_DIR}/include" \
          LDFLAGS="-L${OPENSSL_ROOT_DIR}/lib64 -Wl,-rpath,${OPENSSL_ROOT_DIR}/lib64" \
          LD_LIBRARY_PATH="${OPENSSL_ROOT_DIR}/lib64" \
          make -j"$(nproc)"
          LD_LIBRARY_PATH="${OPENSSL_ROOT_DIR}/lib64" make altinstall
          echo "/opt/python-${PYTHON_VERSION}/lib" > "/etc/ld.so.conf.d/python-${PYTHON_VERSION}.conf"
          ldconfig
          ln -sf "/opt/python-${PYTHON_VERSION}/bin/python3.12" /usr/local/bin/python3.12
          ln -sf "/opt/python-${PYTHON_VERSION}/bin/pip3.12" /usr/local/bin/pip3.12
          ln -sf "/opt/python-${PYTHON_VERSION}/bin/python3.12" /usr/local/bin/python
          ln -sf "/opt/python-${PYTHON_VERSION}/bin/pip3.12" /usr/local/bin/pip
          python3.12 -c "import ssl; print(ssl.OPENSSL_VERSION)"
          python3.12 -m pip install --no-cache-dir --upgrade pip wheel setuptools
          rm -rf "/tmp/Python-${PYTHON_VERSION}" "/tmp/Python-${PYTHON_VERSION}.tgz"

      - name: Run tests
        run: |
          cd pcwcc
          python3.12 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt
          python -m pip install -r tests/requirements.txt
          pytest -q -m "not integration"

      - name: Mark repository as safe
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Extract version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Cache ESP-IDF
        uses: actions/cache@v5
        with:
          path: |
            .cache/esp-idf
            .cache/esp-idf-tools
          key: esp-idf-${{ runner.os }}-${{ env.IDF_VERSION }}
          restore-keys: |
            esp-idf-${{ runner.os }}-${{ env.IDF_VERSION }}-
            esp-idf-${{ runner.os }}-

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      - name: Build release artifacts
        run: |
          ./scripts/make_release.sh "$VERSION"

      - name: Show artifacts
        run: |
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PC Water Cooling Controller ${{ env.VERSION }}"
          tag_name: ${{ env.VERSION }}
          prerelease: true
          files: |
            dist/*
          generate_release_notes: true
