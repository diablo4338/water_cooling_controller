name: Release Linux

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version
        required: true
        default: "3.12.13"
      openssl_version:
        description: OpenSSL version
        required: true
        default: "3.2.3"
      esp_idf_version:
        description: ESP-IDF version
        required: true
        default: "v5.4.1"
      runner:
        description: "Runner"
        required: true
        default: "github-hosted"
        type: choice
        options:
          - self-hosted
          - github-hosted
      

  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  release-linux:
    runs-on: ${{ inputs.runner == 'self-hosted' && fromJSON('["self-hosted", "Linux", "X64"]') || 'ubuntu-22.04' }}
    permissions:
      contents: write

    env:
      IMAGE_NAME: pcwcc-release-build:ci
      PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.12.13' }}
      OPENSSL_VERSION: ${{ github.event.inputs.openssl_version || '3.2.3' }}
      ESP_IDF_VERSION: ${{ github.event.inputs.esp_idf_version || 'v5.4.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ubuntu20
          load: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            OPENSSL_VERSION=${{ env.OPENSSL_VERSION }}
            ESP_IDF_VERSION=${{ env.ESP_IDF_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Show tool versions
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "${IMAGE_NAME}" \
            bash -lc 'python --version && openssl version && idf.py --version'

      - name: Run tests
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "${IMAGE_NAME}" \
            bash -lc '
              python -m venv /tmp/pcwcc-test-venv
              . /tmp/pcwcc-test-venv/bin/activate
              python -m pip install --upgrade pip wheel setuptools
              python -m pip install -e ./pcwcc
              python -m pip install -r ./pcwcc/tests/requirements.txt
              pytest ./pcwcc/tests
            '

      - name: Resolve build version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build AppImage
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "${IMAGE_NAME}" \
            bash -lc './scripts/build_appimage.sh "${VERSION}"'

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcwcc-linux-appimage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Create prerelease
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: PC Water Cooling Controller ${{ env.VERSION }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/*.AppImage
          generate_release_notes: true
