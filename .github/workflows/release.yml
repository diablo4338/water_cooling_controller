name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build release on Ubuntu 20.04 container
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04

    env:
      DEBIAN_FRONTEND: noninteractive
      IDF_VERSION: v5.4.1

    steps:
      - name: Install base packages
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates \
            curl \
            wget \
            git \
            zip \
            unzip \
            xz-utils \
            file \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            flex \
            bison \
            gperf \
            pkg-config \
            libffi-dev \
            libssl-dev \
            dfu-util \
            libusb-1.0-0 \
            libglib2.0-0 \
            libdbus-1-3 \
            libxcb1 \
            libx11-6 \
            libxext6 \
            libxrender1 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6 \
            zlib1g \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mark repository as safe
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Extract version
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Make scripts executable
        run: |
          chmod +x scripts/*.sh

      - name: Build release artifacts
        run: |
          ./scripts/make_release.sh "$VERSION"

      - name: Show artifacts
        run: |
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PC Water Cooling Controller ${{ env.VERSION }}"
          tag_name: ${{ env.VERSION }}
          files: |
            dist/*
          generate_release_notes: true