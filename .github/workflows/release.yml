name: Release Linux

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Python version
        required: true
        default: "3.12.13"
      openssl_version:
        description: OpenSSL version
        required: true
        default: "3.2.3"
      esp_idf_version:
        description: ESP-IDF version
        required: true
        default: "v5.4.4"
      runner:
        description: "Runner"
        required: true
        default: "github-hosted"
        type: choice
        options:
          - self-hosted
          - github-hosted
      

  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  release-linux:
    runs-on: ${{ inputs.runner == 'self-hosted' && 'self-hosted' || 'ubuntu-22.04' }}
    permissions:
      contents: write

    env:
      IMAGE_NAME: pcwcc-release-build:ci
      FIRMWARE_IMAGE: pcwcc-firmware-build:ci
      DESKTOP_PLATFORM: linux/amd64
      PYTHON_VERSION: ${{ github.event.inputs.python_version || '3.12.13' }}
      OPENSSL_VERSION: ${{ github.event.inputs.openssl_version || '3.2.3' }}
      ESP_IDF_VERSION: ${{ github.event.inputs.esp_idf_version || 'v5.4.4' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up x86-64 emulation
        if: runner.arch != 'X64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: release-builder
          keep-state: ${{ inputs.runner == 'self-hosted' }}

      - name: Build x86-64 desktop image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ubuntu20
          target: desktop
          platforms: ${{ env.DESKTOP_PLATFORM }}
          load: true
          tags: ${{ env.IMAGE_NAME }}
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            OPENSSL_VERSION=${{ env.OPENSSL_VERSION }}
          provenance: false

      - name: Build native firmware image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ubuntu20
          target: firmware
          load: true
          tags: ${{ env.FIRMWARE_IMAGE }}
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            OPENSSL_VERSION=${{ env.OPENSSL_VERSION }}
            ESP_IDF_VERSION=${{ env.ESP_IDF_VERSION }}
          provenance: false

      - name: Run desktop tests
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ env.DESKTOP_PLATFORM }}
        run: ./scripts/run_release_tests.sh

      - name: Resolve build version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build firmware and package hardware files
        run: |
          rm -rf dist
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -w /work \
            "${FIRMWARE_IMAGE}" \
            bash -c './scripts/build_firmware.sh "$1" && ./scripts/build_hardware.sh "$1"' _ "${VERSION}"

      - name: Build x86-64 AppImage
        run: |
          docker run --rm --platform "${DESKTOP_PLATFORM}" \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" \
            -w /work \
            "${IMAGE_NAME}" \
            ./scripts/build_appimage.sh "${VERSION}"

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > "pc-water-cooling-controller-${VERSION}-checksums.sha256"

      - name: Create prerelease
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: PC Water Cooling Controller ${{ env.VERSION }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
