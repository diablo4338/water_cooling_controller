name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pcwcc-tests:
    name: PCWCC Python tests
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates \
            git \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            libglib2.0-0 \
            libdbus-1-3 \
            libxcb1 \
            libx11-6 \
            libxext6 \
            libxrender1 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          cd pcwcc
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt
          python -m pip install -r tests/requirements.txt
          pytest -q -m "not integration"